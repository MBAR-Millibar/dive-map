<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/jsvectormap/dist/jsvectormap.css">
<link rel="stylesheet" href="/dive-map.css">
<script type="importmap">
{ "imports": {
  "jsvectormap": "/node_modules/jsvectormap/dist/jsvectormap.esm.js",
  "jsvectormap/dist/maps/world.js": "/node_modules/jsvectormap/dist/maps/world.js"
} }
</script>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0b1f3a; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  .wrap { position: relative; width: 1280px; height: 640px; box-sizing: border-box; padding: 56px 64px; }
  .mbar-dive-map { position: absolute; left: 40px; right: 40px; top: 200px; bottom: 76px; }
  .mbar-dive-map .jvm-zoom-btn { display: none; }
  h1 { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 10px 0 0; font-size: 26px; color: rgb(255 255 255 / 0.72); }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; font-size: 20px; color: rgb(255 255 255 / 0.6); }
  .legend { display: flex; gap: 26px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Millibar Dive Map</h1>
  <p>The countries a diver has dived in, on one world map. Alpine, React or plain JS.</p>
  <div class="mbar-dive-map"><div id="map" style="height:100%;width:100%"></div></div>
  <div class="foot">
    <div class="legend">
      <span><i style="background:#4daedb"></i>Dived</span>
      <span><i style="background:#f6ad55"></i>Want to dive</span>
      <span><i style="background:rgb(77 174 219 / 0.35)"></i>Community</span>
    </div>
    <div>github.com/MBAR-Millibar/dive-map</div>
  </div>
</div>
<script type="module">
  import { createDiveMap } from '/src/index.js';
  createDiveMap(document.getElementById('map'), {
    selected: ['EG', 'MT', 'MV', 'ID', 'TH', 'MX', 'AU', 'ES', 'HR', 'PT', 'BZ', 'ZA'],
    wishlist: ['PH', 'PW', 'GA', 'FJ', 'EC', 'NO'],
    community: { US: 40, GB: 30, DE: 50, FR: 30, IT: 35, GR: 20, TR: 15, CU: 8, BR: 12, JP: 10, NZ: 9, MY: 14, OM: 6, KE: 5, MZ: 7, CA: 10, CL: 4, SC: 3, BS: 6, HN: 5 },
    autoFocus: false,
  });
</script>
</body>
</html>
